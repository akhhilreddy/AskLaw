x-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: asklaw-backend:${ASKLAW_IMAGE_TAG:-deployment}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  restart: unless-stopped
  environment: &backend-environment
    APP_ENV: production
    APP_NAME: AskLaw API
    API_VERSION: 1.0.0
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the production environment}
    ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ALLOW_LEGACY_UNTYPED_REFRESH_TOKENS: ${ALLOW_LEGACY_UNTYPED_REFRESH_TOKENS:-false}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in the production environment}
    MONGODB_URL: mongodb://mongodb:27017
    MONGODB_DATABASE: ${MONGODB_DATABASE:-asklaw}
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-asklaw_documents_gemini}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
    EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    GEMINI_EMBEDDING_BATCH_SIZE: ${GEMINI_EMBEDDING_BATCH_SIZE:-32}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact frontend origin}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    MAX_DOCUMENT_UPLOAD_BYTES: ${MAX_DOCUMENT_UPLOAD_BYTES:-20971520}
    MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}
    MAX_DOCUMENT_TEXT_BYTES: ${MAX_DOCUMENT_TEXT_BYTES:-5242880}
    SEARXNG_URL: http://searxng:8080/search
    MCP_HOST: 0.0.0.0
    MCP_PORT: 8001
  networks:
    - private
  logging: *production-logging

services:
  mongodb:
    image: mongo:8.3.11-noble
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *production-logging

  redis:
    image: redis:7.4.11-bookworm
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *production-logging

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *production-logging

  searxng:
    image: searxng/searxng:2026.9.23-3cd69d30e
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in the production environment}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_LIMITER: "false"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-cache:/var/cache/searxng
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--header", "X-Real-IP: 127.0.0.1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging: *production-logging

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
    networks:
      - edge
      - private
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "docker.api_healthcheck"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 90s

  celery:
    <<: *backend
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --loglevel=INFO
      - --pool=prefork
      - --concurrency=1
      - --max-tasks-per-child=25
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from redis import Redis; assert Redis.from_url(os.environ['CELERY_BROKER_URL']).ping()"
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 90s

  mcp:
    <<: *backend
    command: ["python", "-m", "app.mcp.server"]
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "docker/mcp_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 45s

  frontend:
    image: asklaw-frontend:${ASKLAW_IMAGE_TAG:-deployment}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL before building the frontend}
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-http://localhost}
      API_SITE_ADDRESS: ${API_SITE_ADDRESS:-http://api.localhost}
      API_CONNECT_ORIGIN: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL before building the frontend}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *production-logging

volumes:
  mongodb-data:
  redis-data:
  qdrant-data:
  searxng-cache:
  caddy-data:
  caddy-config:

networks:
  edge:
  private:
