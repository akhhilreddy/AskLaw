services:

  mongodb:
    image: mongo:8
    container_name: asklaw-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ${ASKLAW_MONGODB_DATA:-asklaw-mongodb-data}:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: asklaw-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${ASKLAW_QDRANT_DATA:-asklaw-qdrant-data}:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: asklaw-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - asklaw-redis-data:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: asklaw-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-asklaw-local-development-only}
      SEARXNG_LIMITER: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${ASKLAW_SEARXNG_SETTINGS:-./deploy/searxng/settings.yml}:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - asklaw-searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  asklaw-mongodb-data:
  asklaw-qdrant-data:
  asklaw-redis-data:
  asklaw-searxng-cache:
