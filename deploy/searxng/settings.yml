use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  debug: false
  instance_name: AskLaw Search
  enable_metrics: false

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

# The required cryptographic key is supplied at runtime through
# SEARXNG_SECRET. No production secret belongs in this file.
